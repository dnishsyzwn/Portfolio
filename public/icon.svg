<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Space Navy Gradient -->
    <linearGradient id="dLogoBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="55%" stop-color="#071524" />
      <stop offset="100%" stop-color="#030811" />
    </linearGradient>

    <!-- Glowing Cybernetic Cyan Border -->
    <linearGradient id="dLogoBorder" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#7cb8e8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1b4c78" stop-opacity="0.75" />
    </linearGradient>

    <!-- Liquid Chrome Silk Gradient for Glyph D -->
    <linearGradient id="dLogoGlyph" x1="26" y1="22" x2="104" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#e0f2fe" />
      <stop offset="42%" stop-color="#7dd3fc" />
      <stop offset="72%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Core Ambient Cyan Bloom -->
    <radialGradient id="dLogoCoreGlow" cx="64" cy="64" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Counter Dark Dimension Depth -->
    <linearGradient id="dCounterDepth" x1="46" y1="42" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040d18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a2038" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Smooth 30px Radius -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#dLogoBg)" stroke="url(#dLogoBorder)" stroke-width="2.5" />

  <!-- Radial Core Atmosphere Bloom -->
  <circle cx="64" cy="64" r="48" fill="url(#dLogoCoreGlow)" />

  <!-- The Architectural Monogram D -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="
    M 38 24
    H 68
    C 87.8823 24 104 40.1177 104 60
    V 68
    C 104 87.8823 87.8823 104 68 104
    H 34
    C 30.6863 104 28 101.314 28 98
    V 34
    C 28 31.8783 29.117 29.9189 30.9289 28.107
    L 34.5 24.5355
    C 35.4378 24.1925 36.6863 24 38 24
    Z
    M 46 46
    C 46 43.7909 47.7909 42 50 42
    H 66
    C 77.0457 42 86 50.9543 86 62
    V 66
    C 86 77.0457 77.0457 86 66 86
    H 50
    C 47.7909 86 46 84.2091 46 82
    V 46
    Z
  " fill="url(#dLogoGlyph)" />

  <!-- Inner Counter Depth & Recess -->
  <path d="
    M 46 46
    C 46 43.7909 47.7909 42 50 42
    H 66
    C 77.0457 42 86 50.9543 86 62
    V 66
    C 86 77.0457 77.0457 86 66 86
    H 50
    C 47.7909 86 46 84.2091 46 82
    V 46
    Z
  " fill="url(#dCounterDepth)" />

  <!-- Liquid Chrome Top Rim Highlight -->
  <path d="M 38 25.5 H 68 C 84 25.5 98 38.5 100 54" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Spine Precision Tech Hairline -->
  <path d="M 33 36 L 33 93" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.8" stroke-linecap="round" />

  <!-- Inner Counter Luminous Cyan Crest -->
  <path d="M 48 43.5 H 66 C 76 43.5 84.5 51.5 84.5 62" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round" />
</svg>